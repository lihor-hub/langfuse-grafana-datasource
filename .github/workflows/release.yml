name: Unsigned release candidate

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'const p=require("./package.json"); if(process.env.RELEASE_TAG !== `v${p.version}`) process.exit(1)'
      - run: npm run format:check && npm run lint && npm run typecheck
      - run: npm run test:ci && npm run test:fixtures && npm run test:release-tools && npm run test:secrets
      - run: npm run build && npm run validate && npm run package
      - name: Upload unsigned archive and checksums
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-langfuse-release-candidate
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
      # No signing, release publication or catalog submission: separate maintainer approval required.
