name: Feature request
description: Propose a focused improvement within the plugin's read-only scope
title: "[Feature]: "
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem before proposing a solution. Pull requests remain paused until after the first verified release, but focused product feedback is welcome now.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem needs to be solved?
      placeholder: When investigating..., I cannot...
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable success without prescribing internals.
      placeholder: A dashboard author can...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain workarounds or existing Grafana/Langfuse features you tried.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Metrics queries
        - Observation queries
        - Score queries
        - Dashboard variables
        - Configuration and authentication
        - Data-frame output
        - Documentation or developer experience
        - Other read-only observability behavior
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request is for read-only Langfuse observability behavior and does not require a mutation API.
          required: true
        - label: I searched existing issues for the same request.
          required: true
        - label: I have not included credentials, private infrastructure details, personal data, or customer observability data.
          required: true
  - type: dropdown
    id: testing
    attributes:
      label: Testing interest after the first release
      description: This does not commit you to contributing code.
      options:
        - I can test a future release candidate
        - I can provide additional use-case details
        - I am not available to test
